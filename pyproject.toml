[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-shepherd"
version = "0.2.1"
description = "A supervisor plugin that observes AI coding agents (Claude Code, Codex, QwenPaw) and injects corrective guidance when they drift off course."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "agent-shepherd contributors" }]
keywords = ["ai-agent", "supervisor", "llm", "claude-code", "codex", "qwenpaw"]
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.scripts]
shepherd = "agent_shepherd.cli:main"
shepherd-hook = "agent_shepherd.adapters.hook:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio", "ruff"]

# Also declared as a uv dependency *group* so a plain `uv sync` installs the
# test stack. Without this, `uv run pytest` can silently resolve a pytest from
# outside the project environment that imports a stale installed copy of this
# package, and report green tests against code that is no longer on disk.
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["agent_shepherd"]
force-include = { "agent_shepherd/adapters/qwenpaw/plugin.json" = "agent_shepherd/adapters/qwenpaw/plugin.json" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]