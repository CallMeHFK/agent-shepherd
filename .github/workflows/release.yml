name: release

# The plugin bundle is a release asset, not a package artifact: QwenPaw installs
# it from the release's zip URL, so the file has to be there by the time anyone
# reads the release page. Building everything here also means a hand-written
# release cannot forget the files every importer actually needs.
on:
  push:
    tags:
      - "v*"

jobs:
  release-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Stdlib only (json + zipfile), so this needs no dependency sync. The
      # assignment is checked separately because `set -e` does not see a failure
      # hidden inside an echo's command substitution.
      - name: Build the QwenPaw plugin zip
        id: plugin
        run: |
          set -euo pipefail
          zip=$(python3 packaging/build_plugin_zip.py)
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
      # The bundle is only the observer; the daemon it talks to is a Python
      # package. Shipping the wheel and sdist too means a box with no git client
      # can still install the supervisor straight from the release page.
      - uses: astral-sh/setup-uv@v5
      - name: Build the daemon wheel and sdist
        run: uv build --out-dir dist
      # Every value interpolated from the event or a step output reaches the
      # shell as an environment variable, never as script text: a tag name is a
      # refname, and refnames allow backquotes and `$`.
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_ZIP: ${{ steps.plugin.outputs.zip }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" \
              --notes "Built from the $tag tag. The attached zip is the QwenPaw plugin bundle; the supervisor daemon is a separate install (see the README inside the archive)."
          fi
          gh release upload "$tag" "$PLUGIN_ZIP" dist/*.whl dist/*.tar.gz --clobber
      - name: Asset URLs
        env:
          PLUGIN_ZIP: ${{ steps.plugin.outputs.zip }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for f in "$PLUGIN_ZIP" dist/*.whl dist/*.tar.gz; do
            echo "https://github.com/$REPO/releases/download/$GITHUB_REF_NAME/$(basename "$f")"
          done
